<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kie Image Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- Login-Overlay, nur sichtbar wenn ACCESS_PASSWORD gesetzt ist -->
<div id="login-overlay" class="overlay hidden">
  <form id="login-form" class="login-card">
    <p class="login-eyebrow">kie image studio</p>
    <h1>Zugang</h1>
    <input type="password" id="login-password" placeholder="Passwort" autocomplete="current-password" />
    <button type="submit">Betreten</button>
    <p id="login-error" class="login-error hidden">Falsches Passwort.</p>
  </form>
</div>

<div id="app" class="app hidden">

  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-mark">◆</span>
      <span>Kie Image Studio</span>
    </div>
    <div id="topbar-status" class="topbar-status">bereit</div>
  </header>

  <div class="layout">

    <!-- Linke Spalte: Steuerung -->
    <aside class="darkroom">

      <section class="field">
        <label class="field-label">Modell</label>
        <select id="model-select"></select>
        <p id="model-blurb" class="field-hint"></p>
      </section>

      <!-- Referenzbild-Kategorien werden hier per JS eingefuegt -->
      <div id="reference-sections"></div>

      <section class="field">
        <p id="ref-status" class="ref-status"></p>
        <button id="ref-clear-all" type="button" class="ref-clear-all">Alle Referenzen leeren</button>
      </section>

      <section class="field">
        <label class="field-label" for="prompt-start">Prompt — Startbild</label>
        <textarea id="prompt-start" rows="4" placeholder="Was soll das Startbild zeigen?"></textarea>
      </section>

      <section class="field">
        <label class="field-label" for="prompt-end">Prompt — Endbild <span class="field-label-muted">(optional)</span></label>
        <textarea id="prompt-end" rows="4" placeholder="Leer lassen, wenn nur ein Bild entstehen soll."></textarea>
      </section>

      <section class="field field-row">
        <div>
          <label class="field-label" for="aspect-ratio">Seitenverhältnis</label>
          <select id="aspect-ratio"></select>
        </div>
        <div id="resolution-wrap">
          <label class="field-label" for="resolution">Auflösung</label>
          <select id="resolution"></select>
        </div>
      </section>

      <button id="generate-btn" class="generate-btn">
        <span class="generate-btn-label">Bild entwickeln</span>
      </button>

      <p id="generate-error" class="generate-error hidden"></p>

    </aside>

    <!-- Rechte Spalte: Kontaktbogen / Ergebnisse -->
    <main class="lightbox">
      <div id="results-grid" class="results-grid"></div>
      <p id="empty-state" class="empty-state">
        Noch nichts entwickelt. Referenzen befüllen (optional), Prompt eingeben, entwickeln.
      </p>
    </main>

  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
