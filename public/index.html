<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kie Image Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- Login-Overlay, nur sichtbar wenn ACCESS_PASSWORD gesetzt ist -->
<div id="login-overlay" class="overlay hidden">
  <form id="login-form" class="login-card">
    <p class="login-eyebrow">kie image studio</p>
    <h1>Zugang</h1>
    <input type="password" id="login-password" placeholder="Passwort" autocomplete="current-password" />
    <button type="submit">Betreten</button>
    <p id="login-error" class="login-error hidden">Falsches Passwort.</p>
  </form>
</div>

<div id="app" class="app hidden">

  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-mark">◆</span>
      <span>Kie Image Studio</span>
    </div>
    <div id="topbar-status" class="topbar-status">bereit</div>
  </header>

  <div class="layout">

    <!-- Linke Spalte: Steuerung -->
    <aside class="darkroom">

      <section class="field">
        <label class="field-label">Modell</label>
        <select id="model-select"></select>
        <p id="model-blurb" class="field-hint"></p>
      </section>

      <section class="field">
        <label class="field-label" for="prompt">Prompt</label>
        <textarea id="prompt" rows="6" placeholder="Beschreibe, was entstehen soll…"></textarea>
      </section>

      <section class="field field-row">
        <div>
          <label class="field-label" for="aspect-ratio">Seitenverhältnis</label>
          <select id="aspect-ratio"></select>
        </div>
        <div id="resolution-wrap">
          <label class="field-label" for="resolution">Auflösung</label>
          <select id="resolution"></select>
        </div>
      </section>

      <section class="field">
        <label class="field-label">Referenzbilder <span id="ref-limit" class="field-label-muted"></span></label>
        <div id="dropzone" class="dropzone">
          <p>Bilder hierher ziehen oder klicken</p>
          <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" multiple hidden />
        </div>
        <div id="ref-thumbs" class="ref-thumbs"></div>
      </section>

      <button id="generate-btn" class="generate-btn">
        <span class="generate-btn-label">Bild entwickeln</span>
      </button>

      <p id="generate-error" class="generate-error hidden"></p>

    </aside>

    <!-- Rechte Spalte: Kontaktbogen / Ergebnisse -->
    <main class="lightbox">
      <div id="results-grid" class="results-grid"></div>
      <p id="empty-state" class="empty-state">
        Noch nichts entwickelt. Prompt eingeben, Modell wählen, loslegen.
      </p>
    </main>

  </div>
</div>

<template id="tpl-card-pending">
  <div class="card card-pending">
    <div class="card-media">
      <div class="developing-fill"></div>
      <div class="card-media-label">wird entwickelt…</div>
    </div>
    <div class="card-meta">
      <span class="card-model"></span>
      <span class="card-state"></span>
    </div>
    <p class="card-prompt"></p>
  </div>
</template>

<template id="tpl-card-done">
  <div class="card card-done">
    <div class="card-media">
      <img class="card-img" alt="" />
    </div>
    <div class="card-meta">
      <span class="card-model"></span>
      <a class="card-download" download>Herunterladen ↓</a>
    </div>
    <p class="card-prompt"></p>
    <button class="card-use-ref">Als Referenz verwenden</button>
  </div>
</template>

<template id="tpl-card-error">
  <div class="card card-error">
    <div class="card-media card-media-error">
      <div class="card-media-label">fehlgeschlagen</div>
    </div>
    <div class="card-meta">
      <span class="card-model"></span>
    </div>
    <p class="card-prompt"></p>
    <p class="card-error-msg"></p>
  </div>
</template>

<script src="/app.js"></script>
</body>
</html>
